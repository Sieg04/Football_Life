<div class="career-shell" [class.recording-active]="recordingMode">
  <header class="app-header" *ngIf="!recordingMode">
    <div class="logo-container">
      <img src="assets/fl_logo.png" alt="Football Life" class="fl-logo" />
      <span class="app-title display-font">FOOTBALL LIFE</span>
    </div>

    <nav class="app-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-item display-font"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="header-status">
      <span class="player-summary" *ngIf="session">
        <span class="player-name-chip display-font">{{ playerName }}</span>
        <span class="ovr-chip display-font">{{ playerOvr }} OVR</span>
      </span>
      <span class="fl-badge fl-badge-accent display-font">
        SEASON {{ currentSeason }}
      </span>
    </div>
  </header>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
